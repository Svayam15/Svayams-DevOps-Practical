apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: student-app-alerts
  namespace: student
  labels:
    release: monitoring
spec:
  groups:
    - name: student-app
      rules:
        - alert: StudentAppDown
          expr: absent(up{job="student-app"} == 1)
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "No healthy student-app target"
        - alert: StudentAppHighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[2m]))
              / sum(rate(http_requests_total[2m])) > 0.05
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "More than 5% of requests are failing"
        - alert: StudentAppSlowRequests
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "95th percentile latency is above 1 second"
