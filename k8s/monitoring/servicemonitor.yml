apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: student-app
  namespace: student
  labels:
    release: monitoring            # must match the Helm release name of kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: student-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
